<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftAid Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #ef4444;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #dc2626;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background: #f9f9f9;
        }
        .success {
            background: #d4edda !important;
            border-color: #c3e6cb !important;
        }
        .error {
            background: #f8d7da !important;
            border-color: #f5c6cb !important;
        }
    </style>
</head>
<body>
    <h1>SwiftAid Login Test</h1>
    
    <form id="loginForm">
        <label>Email:</label>
        <input type="email" id="email" value="driver2@test.com" required>
        
        <label>Password:</label>
        <input type="password" id="password" value="test123" required>
        
        <button type="submit">Login</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.textContent = 'Logging in...';
            resultDiv.className = '';
            
            try {
                const response = await fetch('http://localhost:5001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <strong>✅ Login Successful!</strong><br>
                        User: ${data.user.full_name}<br>
                        Email: ${data.user.email}<br>
                        Role: ${data.user.role}<br>
                        Token: ${data.token.substring(0, 20)}...<br>
                        <br>
                        <button onclick="goToDashboard()">Go to Dashboard</button>
                    `;
                    
                    // Store in localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `<strong>❌ Login Failed</strong><br>${data.message || 'Unknown error'}`;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<strong>❌ Connection Error</strong><br>${error.message}<br><br>Make sure backend is running on port 5001`;
            }
        });
        
        function goToDashboard() {
            window.location.href = 'http://localhost:3000/driver/dashboard';
        }
    </script>
</body>
</html>
